    <script>
      // Gracefully handle benign HMR/WebSocket reconnection notices in cloud preview iframes
      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
